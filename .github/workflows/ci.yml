name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: book_studio_e2e
          POSTGRES_PASSWORD: book_studio
          POSTGRES_USER: book_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm types:check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Check PDF tooling
        run: |
          test "$(uv run .agents/skills/import-book/scripts/pdf_tool.py page-count examples/sample-book.pdf)" -ge 2
          uv run .agents/skills/import-book/scripts/pdf_tool.py render examples/sample-book.pdf --pages 1,2 --output-dir /tmp/book-studio-pdf-smoke
          test -s /tmp/book-studio-pdf-smoke/page-0001.png
          test -s /tmp/book-studio-pdf-smoke/page-0002.png
          ! uv run .agents/skills/import-book/scripts/pdf_tool.py render examples/sample-book.pdf --pages 0 --output-dir /tmp/book-studio-pdf-smoke
      - name: Scan committed content for secrets
        run: gitleaks git --redact --no-banner .
